name: aws-setup
description: Assume OIDC role for S3
inputs:
  role:
    description: IAM role ARN
    required: true
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gha-${{ github.run_id }}
