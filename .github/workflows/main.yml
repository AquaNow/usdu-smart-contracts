name: USDU Smart Contract DEV Pipeline

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read
  checks: write
  packages: read
  statuses: write

env:
  NETWORK: mainnet

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: AeduRunner

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: "npm"
          always-auth: true
          node-version: "20.18.x"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test

      - name: Run coverage
        run: npm run coverage